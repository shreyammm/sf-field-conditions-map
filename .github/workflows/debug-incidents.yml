name: Debug incident query

on:
  push:
    paths:
      - scripts/debug_incident_query.py
      - .github/workflows/debug-incidents.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/debug_incident_query.py
