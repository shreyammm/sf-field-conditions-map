name: Build and deploy map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh mostly-static source snapshots once a week.
    - cron: "17 14 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build self-contained site
        run: |
          python scripts/build_site.py
          python scripts/add_hills.py
          python scripts/patch_hill_ui.py

      - name: Upload inspectable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          retention-days: 7

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
