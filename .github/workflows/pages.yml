name: Build and deploy map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Closures, street-surface permits, and SFPD incidents are daily feeds.
    - cron: "17 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spatial dependency
        run: python -m pip install --disable-pip-version-check shapely==2.1.2

      - name: Build and audit self-contained site
        run: |
          python scripts/build_site.py
          python scripts/direct_contour_hills.py
          python scripts/add_closures.py
          python scripts/add_surface_permits.py
          python scripts/add_incidents.py
          python scripts/enrich_closure_context.py
          python scripts/patch_hill_ui.py
          python scripts/fix_hill_text.py
          python scripts/flag_low_confidence_hills.py
          python scripts/patch_closure_ui.py
          python scripts/prepare_surface_banner.py
          python scripts/patch_surface_permit_ui.py
          python scripts/refine_surface_permit_ui.py
          python scripts/finalize_audit_ui.py
          python scripts/finalize_permit_aggregation_ui.py
          python scripts/refine_closure_context_ui.py
          python scripts/audit_closure_context.py
          # General data/layer audit before the date-control UX mutation.
          python scripts/audit_build.py
          # Final product model: no date by default; day-level closure overlap.
          python scripts/optional_planning_date_ui.py
          # Recent SFPD incidents are an independent, opt-in lookback layer.
          python scripts/patch_incident_ui.py
          python scripts/audit_planning_date.py
          python scripts/audit_incidents.py

      - name: Upload inspectable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          retention-days: 7

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
