name: Build and deploy map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild refreshes bundled source snapshots. The optional live
    # dispatch layer queries the official DataSF feed only while enabled.
    - cron: "17 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spatial dependency
        run: python -m pip install --disable-pip-version-check shapely==2.1.2

      - name: Build and audit site
        run: |
          python scripts/build_site.py
          python scripts/direct_contour_hills.py
          python scripts/add_closures.py
          python scripts/add_surface_permits.py
          # Audited recent fallback snapshot for the official real-time dispatch feed.
          python scripts/add_live_calls.py
          python scripts/enrich_closure_context.py
          python scripts/patch_hill_ui.py
          python scripts/fix_hill_text.py
          python scripts/flag_low_confidence_hills.py
          python scripts/patch_closure_ui.py
          python scripts/prepare_surface_banner.py
          python scripts/patch_surface_permit_ui.py
          python scripts/refine_surface_permit_ui.py
          python scripts/finalize_audit_ui.py
          python scripts/finalize_permit_aggregation_ui.py
          python scripts/refine_closure_context_ui.py
          python scripts/audit_closure_context.py
          # General data/layer audit before final UX mutations.
          python scripts/audit_build.py
          # No date by default; day-level closure overlap.
          python scripts/optional_planning_date_ui.py
          # Short-window law-enforcement dispatch activity: 1–48h, official live API + fallback.
          python scripts/patch_live_calls_ui.py
          # Provenance/visual pass, then final semantic/freshness guards over
          # the exact artifact users will receive.
          python scripts/finalize_source_links_and_safety_color.py
          python scripts/final_accuracy_pass.py
          python scripts/enforce_source_freshness_warning.py
          # Turf-cutting workspace: multi-precinct focus/summary plus fixed-size
          # dispatch markers colored by documented DEM priority.
          python scripts/add_precinct_focus_workspace.py
          # Final field-use correctness/performance pass. This runs after all UI
          # mutations so the audits below inspect the exact artifact deployed.
          python scripts/final_field_ux_performance.py
          # Polygon display and unique summary assignment intentionally differ
          # for parcels that cross precinct boundaries.
          python scripts/fix_parcel_focus_semantics.py
          # Final interaction pass: easy map-based precinct picking, stale-live
          # summary guard, and low-DOM citywide street overview.
          python scripts/final_turf_usability.py
          # Make repeated closure records legible and make the housing encoding
          # explicit as an access-verification screen rather than a no-canvass claim.
          python scripts/clarify_closures_housing.py
          # Actual terrain uses compact official contour paths; longer-horizon
          # incident context is a build-time SFPD snapshot with rolling windows.
          python scripts/add_topography_history_v2.py
          # Transparent frequency+severity context by precinct from the same
          # SFPD incident source; this is not a calibrated safety/risk score.
          python scripts/add_precinct_incident_index.py
          # Current Supervisor Districts are categorical background context only
          # and never alter turf/layer counts.
          python scripts/add_supervisor_districts.py
          # Last-mile turf-cutter clarity: visible parcel snapshot date,
          # interpretable contours, accessible search, and low-zoom incident guard.
          python scripts/final_cutting_turf_polish.py
          # Precinct labels, stronger district colors, ranking presentation, and
          # low-risk render/interaction performance hardening.
          python scripts/final_precinct_labels_index_performance.py
          python scripts/audit_planning_date.py
          python scripts/audit_precinct_workspace.py
          python scripts/audit_parcel_focus_semantics.py
          python scripts/audit_field_ux_performance.py
          python scripts/audit_turf_usability.py
          python scripts/audit_closure_housing_clarity.py
          python scripts/audit_topography_history.py
          python scripts/audit_precinct_incident_index.py
          python scripts/audit_supervisor_districts.py
          python scripts/audit_final_turf_polish.py
          python scripts/audit_final_map_hardening_v2.py
          python scripts/audit_source_registry_v2.py
          python scripts/deep_accuracy_audit.py

      - name: Upload inspectable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          retention-days: 7

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
