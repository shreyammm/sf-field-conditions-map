name: Apply hill layer patch

on:
  push:
    branches: [hill-layer-dev]
    paths:
      - tools/hills.patch.gz.b64
      - .github/workflows/apply-hills.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hill-layer-dev
          fetch-depth: 0
      - name: Apply audited hill-layer patch
        run: |
          base64 -d tools/hills.patch.gz.b64 | gzip -dc > /tmp/hills.patch
          git apply --check /tmp/hills.patch
          git apply /tmp/hills.patch
          python -m py_compile scripts/build_site.py
          python - <<'PY'
          from pathlib import Path
          text = Path('src/index.template.html').read_text()
          start = text.rfind('<script>') + len('<script>')
          end = text.rfind('</script>')
          Path('/tmp/map.js').write_text(text[start:end])
          PY
          node --check /tmp/map.js
      - name: Remove development scaffolding
        run: |
          rm -f tools/hills.patch.gz.b64
          rm -f scripts/inspect_hill_source.py
          rm -f .github/workflows/inspect-hills.yml
          rm -f .github/workflows/apply-hills.yml
      - name: Commit hill layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add contour-derived hill grade layer"
          git push origin HEAD:hill-layer-dev
